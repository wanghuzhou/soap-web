name: Release

# 1) 推送 v*.*.* 形式的 tag 时自动发版（正文 = 自动生成的 changelog）。
# 2) workflow_dispatch 仅用于手动补跑：给一个已存在 tag 重新构建并补传资产。
#
# 设计要点：
# - 不再用 on.release[published] 触发。release 由本 workflow 自己创建，
#   否则会出现「推 tag 建 release → 再触发一次构建」的重复运行。
# - build 全部成功后才创建 release（needs + 独立 job），构建失败不会留下空 release。
# - tag 面较窄（v*.*.*），配合下面的存在性判断，误推历史 tag 也不会措手不及地覆盖已有 release。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建并补传资产的已有 tag，例如 v1.0.0'
        required: true
        type: string

# 默认只读；只有 publish job 需要写权限。
permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 浏览器/CLI 版：纯 Go 交叉编译，全部在 ubuntu-latest 上完成。
  #    Windows arm64 与 Linux arm64 不再发布。
  # ---------------------------------------------------------------------------
  build-web:
    name: Web ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: '.exe', pack: zip }
          - { goos: linux,   goarch: amd64, ext: '',     pack: tar.gz }
          - { goos: darwin,  goarch: amd64, ext: '',     pack: zip }
          - { goos: darwin,  goarch: arm64, ext: '',     pack: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 事件下默认就是该 tag，这里显式写出以便手动重跑时也检出 tag 代码
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 读取 go 1.27.1；若 runner 未收录可改为 go-version: '1.27.1'
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"   # tag 里可能含 /，不能出现在文件名中
          NAME="soap-web_${SAFE_TAG}_${GOOS}_${GOARCH}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}/bin"
          go build -trimpath -ldflags='-s -w' -o "${STAGE}/bin/soapweb${EXT}" ./cmd/soapweb
          cp README.md "${STAGE}/"

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PACK: ${{ matrix.pack }}
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"   # tag 里可能含 /，不能出现在文件名中
          NAME="soap-web_${SAFE_TAG}_${GOOS}_${GOARCH}"
          STAGE="dist/${NAME}"

          # zip / tar 都会保留可执行位（macOS 解压后可直接运行）
          chmod 755 "${STAGE}/bin/"*

          if [ "$GOOS" = "windows" ]; then
            # 生成纯 ASCII 名的启动脚本：避免 zip 内中文文件名在 Windows 解压时乱码，
            # 也避免 bat 里的中文提示在非 UTF-8 控制台显示乱码。
            # 目录结构 bin/soapweb.exe 与项目自带的启动脚本约定一致。
            printf '%s\r\n' \
              '@echo off' \
              'setlocal' \
              'cd /d "%~dp0"' \
              'if not exist "bin\soapweb.exe" (' \
              '  echo [ERROR] bin\soapweb.exe not found.' \
              '  pause' \
              '  exit /b 1' \
              ')' \
              '"bin\soapweb.exe" -addr 127.0.0.1:8420 -data "bin\data" %*' \
              > "${STAGE}/start.bat"
          else
            cp start.sh "${STAGE}/"
            chmod 755 "${STAGE}/start.sh"
          fi

          if [ "$GOOS" = "darwin" ]; then
            # GitHub 下载的文件会带 quarantine 属性，附一份排障说明
            printf '%s\n' \
              'If macOS blocks the app ("unidentified developer"), run this once:' \
              '' \
              '    xattr -dr com.apple.quarantine <this-folder>' \
              '' \
              'Then start with:  bash start.sh' \
              > "${STAGE}/MACOS-README.txt"
          fi

          case "$PACK" in
            zip)    ( cd dist && zip -qr "${NAME}.zip" "${NAME}" ) ;;
            tar.gz) ( cd dist && tar -czf "${NAME}.tar.gz" "${NAME}" ) ;;
          esac
          rm -rf "${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: soap-web-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) 桌面版 Windows（仅 x64）：Wails 的 Windows 后端是纯 Go，关闭 CGO 后在
  #    ubuntu 上交叉编译即可，无需 Windows runner 或 mingw。
  # ---------------------------------------------------------------------------
  build-desktop-windows:
    name: Desktop windows/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build desktop
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"
          NAME="soap-web_${SAFE_TAG}_windows_amd64_desktop"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}/bin"
          go build -tags production -trimpath -ldflags='-s -w -H windowsgui' \
            -o "${STAGE}/bin/soapweb-desktop.exe" ./cmd/soapweb-desktop
          cp README.md "${STAGE}/"
          printf '%s\r\n' \
            'soap-web desktop (Windows x64)' \
            '' \
            'Run bin\soapweb-desktop.exe.' \
            'Requires the WebView2 Runtime (Windows 10/11 usually includes it).' \
            'Data lives in data\ next to the exe; use -data <dir> to override.' \
            > "${STAGE}/DESKTOP-README.txt"
          ( cd dist && zip -qr "${NAME}.zip" "${NAME}" )
          rm -rf "${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: soap-web-desktop-windows-amd64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3) 桌面版 macOS（x64 + arm64）：Wails 的 macOS 后端是 cgo + Objective-C，
  #    只能在 macOS runner 上构建。macOS 14 已于 2026-11-02 退役，这里用
  #    macOS 15 的 Intel / Apple Silicon 原生 runner 各构建一次，再用 lipo
  #    校验产物架构。
  # ---------------------------------------------------------------------------
  build-desktop-macos:
    name: Desktop darwin/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, goarch: amd64, lipo: x86_64 }
          - { runner: macos-15,       goarch: arm64, lipo: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build .app
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          chmod +x build-macos.sh
          VERSION="${TAG#v}" ./build-macos.sh
          ACTUAL=$(lipo -archs "bin/soap-web.app/Contents/MacOS/soapweb-desktop")
          echo "built architecture: ${ACTUAL}"
          if [ "${ACTUAL}" != "${{ matrix.lipo }}" ]; then
            echo "architecture mismatch: want ${{ matrix.lipo }}, got ${ACTUAL}" >&2
            exit 1
          fi

      - name: Package
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"
          NAME="soap-web_${SAFE_TAG}_darwin_${GOARCH}_desktop"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          cp -R "bin/soap-web.app" "${STAGE}/"
          printf '%s\n' \
            'soap-web desktop for macOS' \
            '' \
            'This build is ad-hoc signed. If macOS blocks it, run once:' \
            '' \
            '    xattr -dr com.apple.quarantine <this-folder>' \
            '' \
            'Data directory: ~/Library/Application Support/soap-web/data' \
            > "${STAGE}/DESKTOP-README.txt"
          ( cd dist && ditto -c -k --sequesterRsrc --keepParent "${NAME}" "${NAME}.zip" )
          rm -rf "${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: soap-web-desktop-darwin-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4) 全部构建成功后创建 release 并上传资产
  #    仅此 job 有写权限；并发写同一 release 的问题通过「只在这里写」规避。
  # ---------------------------------------------------------------------------
  publish:
    name: Create release and attach assets
    needs: [build-web, build-desktop-windows, build-desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: soap-web-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          ( cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt )

      # 存在性判断：已有 release 时不再调用 action-gh-release 创建，
      # 避免把人工发布过的 release 正文覆盖掉（正文是自动生成的 changelog）。
      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release $TAG already exists, will only upload assets"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "release $TAG not found, will create it"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ] || [ ! -f dist/SHA256SUMS.txt ]; then
            echo "no assets found" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
